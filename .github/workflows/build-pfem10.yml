name: Build ghostlock‑pfem10
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout源码
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 安装基础依赖
        run: sudo apt update && sudo apt install -y build-essential make

      - name: 安装Android NDK r28c
        uses: Ylarod/setup-ndk-clang@v1
        with:
          ndk-version: r28c

      - name: 修改build.sh脚本内硬编码NDK路径，适配github runner环境
        run: |
          # 把脚本里错误的 /home/runner/Android/Sdk 替换成真实SDK路径
          sed -i 's|/home/runner/Android/Sdk|/usr/local/lib/android/sdk|g' build.sh
          cat build.sh

      - name: 执行编译脚本
        run: |
          chmod +x build.sh
          ./build.sh
          ls -la

      - name: 上传编译产物ghostlock
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock‑pfem10
          path: ghostlock
