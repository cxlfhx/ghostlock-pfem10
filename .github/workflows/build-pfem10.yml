name: Build ghostlock‑pfem10
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout源码
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 安装基础依赖
        run: sudo apt update && sudo apt install -y build-essential make

      - name: 安装Android NDK r28c（匹配build.sh硬编码要求）
        uses: Ylarod/setup-ndk-clang@v1
        id: setup-ndk
        with:
          ndk-version: r28c

      - name: 手动编译，使用NDK r28c clang
        run: |
          NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}
          CLANG=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          $CLANG -O2 -o ghostlock src/*.c lib/*.c -I./model -I./lib
          ls -la

      - name: 上传编译产物ghostlock
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock‑pfem10
          path: ghostlock
