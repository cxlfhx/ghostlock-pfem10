name: Build ghostlock‑pfem10
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout源码
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 安装基础依赖
        run: sudo apt update && sudo apt install -y build-essential wget unzip

      - name: 下载并解压 NDK r28c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk-r28c-linux.zip

      - name: 补丁：替换x86 rdtsc汇编为arm64兼容代码
        run: |
          sed -i 's/asm volatile("rdtsc" : "=a"(a), "=d"(d));/asm volatile("mrs %0, cntvct_el0" : "=r"(a));/g' lib/timeutils.h
          cat lib/timeutils.h

      - name: 手动编译源码
        run: |
          NDK_ROOT=$(pwd)/android-ndk-r28c
          CLANG=${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          $CLANG -O2 -o ghostlock src/*.c -I./model -I./lib
          ls -la

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock‑pfem10
          path: ghostlock
