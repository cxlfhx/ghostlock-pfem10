name: Build ghostlock‑pfem10
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout源码（包含子模块）
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 安装基础依赖
        run: sudo apt update && sudo apt install -y build-essential make

      - name: 安装Android NDK r25c
        uses: Ylarod/setup-ndk-clang@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: 编译pfem10
        run: |
          ls -la
          make NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 上传编译产物ghostlock
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock‑pfem10
          path: ghostlock
