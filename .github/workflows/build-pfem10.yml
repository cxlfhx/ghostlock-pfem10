name: Build ghostlock‑pfem10
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout源码
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 安装基础依赖
        run: sudo apt update && sudo apt install -y build-essential make

      - name: 安装Android NDK r28c
        uses: Ylarod/setup-ndk-clang@v1
        with:
          ndk-version: r28c

      - name: 执行仓库自带build.sh编译
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          chmod +x build.sh
          ./build.sh
          ls -la

      - name: 上传编译产物ghostlock
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock‑pfem10
          path: ghostlock
